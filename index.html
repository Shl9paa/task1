<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Eren Yeager</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            background-image: url("background.jpg");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            font-family: Arial, sans-serif;

            color: white;

        }

        .overlay {

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.55);

            z-index: -1;

        }

        .content {

            height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;

        }

        h1 {

            font-size: 70px;

            letter-spacing: 8px;

            text-shadow:
                0 0 10px #fff,
                0 0 30px #0066ff;

        }

        p {

            margin-top: 20px;

            font-size: 20px;

        }

    </style>

</head>

<body>

    <div class="overlay"></div>

    <div class="content">

        <h1>Eren Yeager</h1>

        <p>
            If you win, you live. If you lose, you die. If you don't fight, you can't win
        </p>

        <p>
            Attack on titan
        </p>

    </div>

</body>

</html>
